<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9f6" />
    <!-- Resolve the theme before first paint so dark visitors never see a light flash. Mirrors src/lib/theme.ts. -->
    <script>
      (function () {
        var theme
        try {
          theme = localStorage.getItem("theme")
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        }
        document.documentElement.dataset.theme = theme
        if (theme === "dark") {
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#141412")
        }
      })()
    </script>
    <meta
      name="description"
      content="Collin Makohon is a senior fullstack engineer in Charlotte, NC who loves solving problems for people. Nine-plus years building software that makes someone's day a little better."
    />
    <meta property="og:title" content="Collin Makohon, Senior Fullstack Engineer" />
    <meta
      property="og:description"
      content="Senior Fullstack Engineer, building with agentic tools every day. Consulting, banking, and now retail."
    />
    <meta property="og:type" content="website" />
    <!-- EDIT-ME: make this absolute (https://<domain>/og.png) once the domain is set. Most link unfurlers ignore relative URLs. -->
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Collin Makohon, Senior Fullstack Engineer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
